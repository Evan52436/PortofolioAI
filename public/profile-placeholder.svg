<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="centerLight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  <circle cx="400" cy="350" r="300" fill="url(#centerLight)"/>

  <!-- Decorative Tech Circles -->
  <circle cx="400" cy="400" r="320" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="12 12" opacity="0.3"/>
  <circle cx="400" cy="400" r="350" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="6 18" opacity="0.25"/>

  <!-- Avatar Head & Shoulders Silhouette -->
  <!-- Head -->
  <circle cx="400" cy="320" r="110" fill="url(#avatarGrad)" filter="url(#blurGlow)"/>
  <!-- Cyber Glasses / Visor line -->
  <rect x="330" y="300" width="140" height="32" rx="16" fill="#0f172a" stroke="url(#glowGrad)" stroke-width="3"/>
  <circle cx="365" cy="316" r="6" fill="#38bdf8"/>
  <circle cx="435" cy="316" r="6" fill="#ec4899"/>
  <path d="M 375 316 L 425 316" stroke="url(#glowGrad)" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Shoulders / Body -->
  <path d="M 220 580 C 220 460, 300 440, 400 440 C 500 440, 580 460, 580 580 Z" fill="url(#avatarGrad)" opacity="0.9"/>
  
  <!-- Sleek Code & Tech Accents -->
  <path d="M 280 480 Q 400 520 520 480" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.4"/>
  
  <!-- Text Label Badge -->
  <rect x="250" y="660" width="300" height="50" rx="25" fill="#0f172a" stroke="url(#avatarGrad)" stroke-width="2"/>
  <text x="400" y="692" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="2">
    DEFAULT AVATAR
  </text>
</svg>
